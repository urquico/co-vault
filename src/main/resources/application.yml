spring:
  application:
    name: covault
  
  datasource:
    url: jdbc:mysql://localhost:3306/co_vault
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  app:
    seed:
      all: true
      user: true